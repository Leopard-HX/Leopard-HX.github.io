# =============================================================================
#  /notes/ 索引页里文件夹的「显示名」和「关键词备注」
# =============================================================================
#  键  = 笔记 front matter 里的 folder，也就是该笔记在 Notes/ 下的相对目录路径，
#        由 scripts/convert-wikilinks.sh 自动写入（形如 "文章整理/arXiv-2607.03749v2"）。
#        键要加引号，因为它含 / 和中文。
#
#  值支持两个键：
#    label : 覆盖显示名。省略时，子文件夹会自动把 "arXiv-2607.03749v2" 简写成
#            "2607.03749"（去掉 arXiv- 前缀和 v1/v2 版本号）。
#    note  : 显示在文件夹名后面的关键词备注。省略则不显示。
#
#  新增论文后，只要在下面补一条 "路径: note: 关键词" 即可。
# =============================================================================

"文章整理":
  label: "文章整理（AI生成警告）"

"文章整理/EHT-观测资料":
  note: "EHT 观测与 Kerr 阴影形状"

